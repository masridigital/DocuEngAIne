name: Azure Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'infra/**'
      - '.github/workflows/azure-deploy.yml'

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  AZURE_RG: 'rg-docuengaine-prod'
  AZURE_LOCATION: 'eastus'
  SQL_DATABASE_NAME: 'DocuEngAIne'
  KEYVAULT_SQL_SECRET_NAME: 'ConnectionStrings--DocuEngAIne'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/DocuEngAIne.Web/package-lock.json

      - name: Install and build SPA
        working-directory: src/DocuEngAIne.Web
        env:
          VITE_ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          VITE_ENTRA_AUTHORITY: ${{ secrets.ENTRA_AUTHORITY }}
          VITE_ENTRA_API_SCOPE: ${{ secrets.ENTRA_API_SCOPE }}
        run: |
          npm ci
          # VITE_* values are baked into the bundle at build time, so a missing secret produces a
          # green build that deploys a SPA telling every visitor sign-in is not configured, while the
          # API still demands a bearer token. Surface it here rather than discovering it in the browser.
          missing=""
          [ -z "$VITE_ENTRA_CLIENT_ID" ] && missing="$missing ENTRA_CLIENT_ID"
          [ -z "$VITE_ENTRA_AUTHORITY" ] && missing="$missing ENTRA_AUTHORITY"
          [ -z "$VITE_ENTRA_API_SCOPE" ] && missing="$missing ENTRA_API_SCOPE"
          if [ -n "$missing" ]; then
            echo "::warning title=SPA will ship without Entra sign-in::Missing repository secrets:$missing"
          fi
          npm run build

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: dotnet publish src/DocuEngAIne.Api/DocuEngAIne.Api.csproj -c Release -o ./publish --no-restore

      - name: Restore .NET local tools
        if: github.ref == 'refs/heads/main'
        run: dotnet tool restore

      # Produces a single self-contained linux-x64 executable ("efbundle") that
      # applies every migration in src/DocuEngAIne.Api/Data/Migrations.
      # ConnectionStrings__DocuEngAIne is a design-time placeholder only: the API's
      # DI throws when it is empty, and nothing connects while the bundle is built.
      # The real connection string is passed to the bundle at run time.
      - name: Build EF migrations bundle
        if: github.ref == 'refs/heads/main'
        env:
          ConnectionStrings__DocuEngAIne: 'Server=localhost;Database=DocuEngAIne;User ID=placeholder;Password=placeholder;TrustServerCertificate=True;'
        run: |
          dotnet ef migrations bundle \
            --project src/DocuEngAIne.Api \
            --startup-project src/DocuEngAIne.Api \
            --configuration Release \
            --self-contained -r linux-x64 \
            -o efbundle --force

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish
          retention-days: 1

      - name: Upload migrations bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: ./efbundle
          retention-days: 1

  infra:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group
        run: |
          az group create \
            --name ${{ env.AZURE_RG }} \
            --location ${{ env.AZURE_LOCATION }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RG }}
          template: ./infra/main.bicep
          parameters: |
            {
              "environment": "prod",
              "sqlAdminLogin": "${{ secrets.SQL_ADMIN_LOGIN }}",
              "sqlAdminPassword": "${{ secrets.SQL_ADMIN_PASSWORD }}",
              "entraAuthority": "${{ secrets.ENTRA_AUTHORITY }}",
              "entraAudience": "${{ secrets.ENTRA_AUDIENCE }}"
            }
          failOnStdErr: false

  # Applies EF migrations before any new code serves traffic. deploy-api is gated
  # on this job, so a failed migration blocks the app deploy instead of shipping
  # code against a schema that does not exist yet.
  migrate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: infra
    steps:
      - name: Download migrations bundle
        uses: actions/download-artifact@v4
        with:
          name: efbundle
          path: ./efbundle-artifact

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # infra/modules/sql.bicep only creates the 0.0.0.0 "Allow Azure services"
      # rule, which does NOT cover GitHub-hosted runners. Open a temporary,
      # run-scoped rule for this runner's public IP and remove it below.
      - name: Open SQL firewall for this runner
        run: |
          set -euo pipefail
          SERVER=$(az sql server list --resource-group "$AZURE_RG" --query "[0].name" -o tsv)
          if [ -z "$SERVER" ]; then
            echo "No SQL server found in resource group $AZURE_RG." >&2
            exit 1
          fi
          RUNNER_IP=$(curl -sS --fail --max-time 20 https://api.ipify.org)
          RULE="gh-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "SQL_SERVER_NAME=$SERVER" >> "$GITHUB_ENV"
          echo "SQL_FIREWALL_RULE=$RULE" >> "$GITHUB_ENV"
          az sql server firewall-rule create \
            --resource-group "$AZURE_RG" \
            --server "$SERVER" \
            --name "$RULE" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none
          echo "Opened temporary firewall rule '$RULE' on '$SERVER'."

      - name: Apply database migrations
        env:
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          # Preferred source: the Key Vault secret provisioned by
          # infra/modules/keyvault.bicep. Requires the deploying service
          # principal to hold a Key Vault data-plane role (the vault is
          # RBAC-authorized; Contributor alone is not enough).
          CONNECTION_STRING=""
          KV_NAME=$(az keyvault list --resource-group "$AZURE_RG" --query "[0].name" -o tsv || true)
          if [ -n "$KV_NAME" ]; then
            CONNECTION_STRING=$(az keyvault secret show \
              --vault-name "$KV_NAME" \
              --name "$KEYVAULT_SQL_SECRET_NAME" \
              --query value -o tsv 2>/dev/null || true)
          fi

          if [ -n "$CONNECTION_STRING" ]; then
            echo "::add-mask::$CONNECTION_STRING"
            echo "Using connection string from Key Vault '$KV_NAME'."
          else
            # Fallback: rebuild the exact string infra/main.bicep composes, from
            # the SQL admin secrets that already exist. No new secret needed.
            echo "Key Vault secret unavailable; composing connection string from SQL admin secrets."
            if [ -z "${SQL_ADMIN_LOGIN}" ] || [ -z "${SQL_ADMIN_PASSWORD}" ]; then
              echo "Key Vault secret was unreadable and SQL_ADMIN_LOGIN/SQL_ADMIN_PASSWORD are not set." >&2
              echo "Set those repository secrets, or grant the deploying service principal the" >&2
              echo "Key Vault Secrets User role on the vault." >&2
              exit 1
            fi
            FQDN=$(az sql server show \
              --resource-group "$AZURE_RG" \
              --name "$SQL_SERVER_NAME" \
              --query fullyQualifiedDomainName -o tsv)
            CONNECTION_STRING="Server=tcp:${FQDN},1433;Initial Catalog=${SQL_DATABASE_NAME};User ID=${SQL_ADMIN_LOGIN};Password=${SQL_ADMIN_PASSWORD};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
            echo "::add-mask::$CONNECTION_STRING"
          fi

          # upload-artifact does not preserve the executable bit.
          chmod +x ./efbundle-artifact/efbundle
          ./efbundle-artifact/efbundle --connection "$CONNECTION_STRING"

      - name: Close SQL firewall for this runner
        if: always()
        run: |
          if [ -n "${SQL_SERVER_NAME:-}" ] && [ -n "${SQL_FIREWALL_RULE:-}" ]; then
            az sql server firewall-rule delete \
              --resource-group "$AZURE_RG" \
              --server "$SQL_SERVER_NAME" \
              --name "$SQL_FIREWALL_RULE" \
              --output none \
              || echo "Cleanup failed; remove firewall rule '$SQL_FIREWALL_RULE' from '$SQL_SERVER_NAME' manually."
          fi

  deploy-api:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: migrate
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Package publish folder
        run: |
          cd ./publish
          zip -r ../publish.zip .
          cd ..

      - name: Deploy to App Service
        run: |
          az webapp deployment source config-zip \
            --resource-group ${{ env.AZURE_RG }} \
            --name docuengaine-prod-app \
            --src ./publish.zip
        env:
          AZURE_CORE_OUTPUT: none

      - name: Cleanup artifact
        uses: geekyeggo/delete-artifact@v4
        with:
          name: |
            api-publish
            efbundle
          failOnError: false
